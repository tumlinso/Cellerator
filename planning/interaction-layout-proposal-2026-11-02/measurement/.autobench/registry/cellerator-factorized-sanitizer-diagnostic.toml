[benchmark]
name = "cellerator-factorized-sanitizer-diagnostic"
revision = 8

[data]
paths = [
  ".autobench/data/factorized-interactions/cellerator-factorized-interactions-source-v15.tar",
  ".autobench/data/factorized-interactions/cellerator-factorized-interactions-source-v15-manifest.json",
  ".autobench/data/factorized-interactions/build-from-cellerator-factorized-interactions-source-v15.py",
]

[build]
argv = [
  "python3", "{snapshot}/.autobench/data/factorized-interactions/build-from-cellerator-factorized-interactions-source-v15.py",
  "--archive", "{snapshot}/.autobench/data/factorized-interactions/cellerator-factorized-interactions-source-v15.tar",
  "--manifest", "{snapshot}/.autobench/data/factorized-interactions/cellerator-factorized-interactions-source-v15-manifest.json",
  "--build", "{build}",
]
expected_seconds = 540
kill_seconds = 600
resources = { cpu_cores = 2, host_memory_bytes = 8589934592 }

[[packet]]
name = "first-memcheck-case-output-diagnostic"
kind = "correctness"
environment = { NVCOMPILER_COMPUTE_SANITIZER_HOME = "/opt/nvidia/hpc_sdk/Linux_x86_64/26.1/cuda/12.9/compute-sanitizer", PYTHONDONTWRITEBYTECODE = "1", CUDA_CACHE_PATH = "{output}/cuda-cache", TMPDIR = "{output}/temp", TEMP = "{output}/temp", TMP = "{output}/temp" }
argv = [
  "python3", "{build}/source/bench/factorized_interactions/validate_runner.py",
  "--workload", "correctness_ordered_tied_zero",
  "--runner", "/opt/nvidia/hpc_sdk/Linux_x86_64/26.1/compilers/bin/compute-sanitizer --tool memcheck --error-exitcode 99 --leak-check full {build}/cmake/factorized_interactions_validator/cellerator_factorized_interaction_runner",
  "--runner-binary", "{build}/cmake/factorized_interactions_validator/cellerator_factorized_interaction_runner",
  "--build-manifest", "{build}/factorized_interactions_build_manifest.json",
  "--route", "packet",
  "--activation-dtype", "fp16",
  "--parameter-dtype", "fp16",
  "--output-dtype", "fp16",
  "--gradient-mode", "overwrite",
  "--expected-uuid", "GPU-6c1cac7f-a360-0aef-ba98-2828bfd1db1a",
  "--artifact-dir", "{output}/case",
]
expected_seconds = 90
kill_seconds = 180
resources = { scheduler = [{ kind = "gpu", quantities = { memory_bytes = 6442450944 }, mode = "exclusive", selectors = { resource_id = "gpu:testlsserver:GPU-6c1cac7f-a360-0aef-ba98-2828bfd1db1a" } }, { kind = "cpu", quantities = { cores = 2 }, mode = "shared" }, { kind = "memory", quantities = { bytes = 8589934592 }, mode = "shared" }], tags = ["gpu.exclusive"] }
