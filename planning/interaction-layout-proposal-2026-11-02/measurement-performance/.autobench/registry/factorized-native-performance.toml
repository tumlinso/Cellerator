[benchmark]
name = "factorized-native-performance"
revision = 1

[data]
paths = [
  ".autobench/data/factorized-interactions/native-qualified-source-1/build-from-native-performance-filtered.py",
  ".autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered-manifest.json",
  ".autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered.tar",
]

[build]
argv = [
  "python3", "{snapshot}/.autobench/data/factorized-interactions/native-qualified-source-1/build-from-native-performance-filtered.py",
  "--archive", "{snapshot}/.autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered.tar",
  "--manifest", "{snapshot}/.autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered-manifest.json",
  "--build", "{build}", "--native-only", "--parallel", "2",
]
expected_seconds = 540
kill_seconds = 600
resources = { cpu_cores = 2, host_memory_bytes = 8589934592 }

[[packet]]
name = "native-dtype-correctness"
kind = "correctness"
environment = { PYTHONDONTWRITEBYTECODE = "1" }
argv = [
  "python3", "{build}/source/bench/factorized_interactions/experiments/run_dtype_qualification.py",
  "--runner", "{build}/native_candidate/native_build/cmake/cellerator_factorized_interaction_candidate_runner",
  "--build-manifest", "{build}/native_candidate/native_build/factorized_interactions_build_manifest.json",
  "--expected-uuid", "GPU-6c1cac7f-a360-0aef-ba98-2828bfd1db1a",
  "--artifact-dir", "{output}/cases",
  "--reference-cache-dir", "{output}/cases/reference-cache",
  "--output", "{output}/dtype-qualification.json",
]
expected_seconds = 420
kill_seconds = 600
resources = { scheduler = [
  { kind = "gpu", quantities = { memory_bytes = 6442450944 }, mode = "exclusive", selectors = { resource_id = "gpu:testlsserver:GPU-6c1cac7f-a360-0aef-ba98-2828bfd1db1a" } },
  { kind = "cpu", quantities = { cores = 2 }, mode = "shared" },
  { kind = "memory", quantities = { bytes = 8589934592 }, mode = "shared" },
], tags = ["gpu.exclusive"] }
