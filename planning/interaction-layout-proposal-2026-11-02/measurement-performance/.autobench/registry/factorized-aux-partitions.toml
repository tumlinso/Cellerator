[benchmark]
name = "factorized-aux-partitions"
revision = 1

[data]
paths = [
  ".autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered.tar",
  ".autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered-manifest.json",
  ".autobench/data/factorized-interactions/prebuilt-native-1/prebuilt-native.tar",
  ".autobench/data/factorized-interactions/prebuilt-native-1/prebuilt-native-manifest.json",
  ".autobench/data/factorized-interactions/prebuilt-native-1/materialize_prebuilt.py",
  ".autobench/data/factorized-interactions/aux-wrapper-1/bounded_validation.py",
  ".autobench/data/factorized-interactions/aux-wrapper-1/run_qualification_partition.py",
  ".autobench/data/factorized-interactions/aux-wrapper-1/tests/test_bounded_validation.py",
  ".autobench/data/factorized-interactions/aux-wrapper-1/tests/test_bounded_qualification.py",
]

[build]
argv = [
  "python3", "{snapshot}/.autobench/data/factorized-interactions/prebuilt-native-1/materialize_prebuilt.py",
  "--source-archive", "{snapshot}/.autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered.tar",
  "--source-manifest", "{snapshot}/.autobench/data/factorized-interactions/native-qualified-source-1/native-performance-filtered-manifest.json",
  "--bundle", "{snapshot}/.autobench/data/factorized-interactions/prebuilt-native-1/prebuilt-native.tar",
  "--bundle-manifest", "{snapshot}/.autobench/data/factorized-interactions/prebuilt-native-1/prebuilt-native-manifest.json",
  "--build", "{build}",
]
expected_seconds = 90
kill_seconds = 180
resources = { cpu_cores = 2, host_memory_bytes = 4294967296 }

[[packet]]
name = "aux-packet-regular"
kind = "correctness"
environment = { PYTHONDONTWRITEBYTECODE = "1", OPENBLAS_NUM_THREADS = "1" }
argv = [
  "python3", "{snapshot}/.autobench/data/factorized-interactions/aux-wrapper-1/run_qualification_partition.py",
  "--kind", "aux", "--role", "packet", "--partition", "regular",
  "--source", "{build}/source",
  "--runner", "{build}/native_candidate/native_build/cmake/cellerator_factorized_interaction_candidate_runner",
  "--build-manifest", "{build}/native_candidate/native_build/factorized_interactions_build_manifest.json",
  "--expected-uuid", "GPU-6c1cac7f-a360-0aef-ba98-2828bfd1db1a",
  "--artifact-dir", "{output}/aux", "--output", "{output}/qualification.json",
]
expected_seconds = 480
kill_seconds = 600
resources = { scheduler = [
  { kind = "gpu", quantities = { memory_bytes = 6442450944 }, mode = "exclusive", selectors = { resource_id = "gpu:testlsserver:GPU-6c1cac7f-a360-0aef-ba98-2828bfd1db1a" } },
  { kind = "cpu", quantities = { cores = 2 }, mode = "shared" },
  { kind = "memory", quantities = { bytes = 8589934592 }, mode = "shared" },
], tags = ["gpu.exclusive"] }

