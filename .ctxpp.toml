version = 1
profile = "view"
tokenizer = "auto"
notation = "token-min"
source_write = false
preserve_public_api = true
preserve_abi = true
allow_cuda = true
sources = ["include/**/*.cuh","include/**/*.h","include/**/*.hh","include/**/*.hpp","include/**/*.hxx","src/**/*.cc","src/**/*.cpp","src/**/*.cu","src/**/*.cuh","src/**/*.cxx","src/**/*.h","src/**/*.hh","src/**/*.hpp","src/**/*.hxx","bindings/**/*.cc","bindings/**/*.cpp","bindings/**/*.cu","bindings/**/*.cuh","bindings/**/*.cxx","bindings/**/*.h","bindings/**/*.hh","bindings/**/*.hpp","bindings/**/*.hxx","examples/**/*.cc","examples/**/*.cpp","examples/**/*.cu","examples/**/*.cuh","examples/**/*.cxx","examples/**/*.h","examples/**/*.hh","examples/**/*.hpp","examples/**/*.hxx","tests/**/*.cc","tests/**/*.cpp","tests/**/*.cu","tests/**/*.cuh","tests/**/*.cxx","tests/**/*.h","tests/**/*.hh","tests/**/*.hpp","tests/**/*.hxx","bench/**/*.cc","bench/**/*.cpp","bench/**/*.cu","bench/**/*.cuh","bench/**/*.cxx","bench/**/*.h","bench/**/*.hh","bench/**/*.hpp","bench/**/*.hxx","compat/**/*.cc","compat/**/*.cpp","compat/**/*.cu","compat/**/*.cuh","compat/**/*.cxx","compat/**/*.h","compat/**/*.hh","compat/**/*.hpp","compat/**/*.hxx","modules/**/*.cc","modules/**/*.cpp","modules/**/*.cu","modules/**/*.cuh","modules/**/*.cxx","modules/**/*.h","modules/**/*.hh","modules/**/*.hpp","modules/**/*.hxx","tools/**/*.cc","tools/**/*.cpp","tools/**/*.cu","tools/**/*.cuh","tools/**/*.cxx","tools/**/*.h","tools/**/*.hh","tools/**/*.hpp","tools/**/*.hxx","experiments/**/*.cc","experiments/**/*.cpp","experiments/**/*.cu","experiments/**/*.cuh","experiments/**/*.cxx","experiments/**/*.h","experiments/**/*.hh","experiments/**/*.hpp","experiments/**/*.hxx"]
exclude = ["build/**","build-*/**","cmake-build-*/**","**/build/**","**/build-*/**","third_party/**","external/**","vendor/**","**/vendor/**","generated/**","**/generated/**",".git/**",".ctxpp/**",".todo-orchestrator/**","docs/**","planning/**","todos/**","history/**","**/history/**","archive/**","archives/**","**/archive/**","**/archives/**","**/archived/**","debug_out/**","data/**",".codex/**",".project-control/**"]

[tool]
compilation_database = "build-ctxpp/compile_commands.json"
max_workers = 4

[budgets]
default_slice_tokens = 2400
route_tokens = 400
fragment_target_tokens = 1200
fragment_soft_max_tokens = 2400
fragment_hard_max_tokens = 3200
fragment_min_tokens = 200
max_fragments_per_host = 8

[identifiers]
rename_locals = true
rename_parameters = false
rename_private_members = false
rename_internal_functions = false
minimum_net_token_saving = 4
allow_unicode_identifiers = false

[comments]
contract_language = true
compress_public_docs = false
preserve_special_comments = true

[rewrites]
remove_redundant_else = true
simplify_exact_bool = true
scalar_ternary = false
remove_braces = false
replace_explicit_type_with_auto = false
invent_macros = false
using_namespace = false

[verification]
build = ["cmake --build build -j \"$(nproc)\" --target cellerator_compute_sparse_ops celleratorSparseRowTransformsTest celleratorSparseColumnMomentsTest"]
targeted_tests = ["./build/celleratorSparseRowTransformsTest", "./build/celleratorSparseColumnMomentsTest"]
full_tests = ["cmake --build build -j \"$(nproc)\""]
abi = []
performance = []

[protected]
paths = []
symbols = []
name_patterns = []
