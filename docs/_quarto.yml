project:
  type: book

book:
  title: "Cellerator"
  subtitle: "Architecture of a performance-first biological execution system"
  downloads:
    - pdf
  chapters:
    - index.qmd
    - architecture.qmd
    - current_implementation.qmd
    - biological_execution_model.qmd
    - cellpack_cp_bp.qmd
    - core_execution_cp_math.qmd
    - baseplane_integration.qmd
    - storage_distribution_and_interop.qmd
    - performance_validation.qmd
    - migration_roadmap.qmd
    - developer_reference.qmd

format:
  html:
    toc: true
    code-copy: true
    theme: cosmo
  pdf:
    documentclass: scrreprt
    classoption:
      - 10pt
    geometry:
      - margin=1.8cm
      - top=1.8cm
      - bottom=1.8cm
    include-in-header: preamble.tex
    pdf-engine: xelatex
    mainfont: "Liberation Sans"
    sansfont: "Liberation Sans"
    monofont: "Menlo"

execute:
  enabled: false
